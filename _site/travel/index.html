<script>
    // Drop Bootstarp low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $body   = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            $navbar.className = " ";
            // wait until animation end.
            setTimeout(function(){
                // prevent frequently toggle
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    // Bind Event
    $toggle.addEventListener('click', function(e){
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        }else{
            __HuxNav__.open()
        }
    })

    /**
     * Since Fastclick is used to delegate 'touchstart' globally
     * to hack 300ms delay in iOS by performing a fake 'click',
     * Using 'e.stopPropagation' to stop 'touchstart' event from 
     * $toggle/$collapse will break global delegation.
     * 
     * Instead, we use a 'e.target' filter to prevent handler
     * added to document close HuxNav.  
     *
     * Also, we use 'click' instead of 'touchstart' as compromise
     */
    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    })
</script>

			const travelMap = L.map("travel-map", { scrollWheelZoom: false }).setView([26, 105], 4);

			L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
				maxZoom: 18,
				attribution: "&copy; OpenStreetMap contributors"
			}).addTo(travelMap);

			function escapeHTML(value) {
				return String(value || "").replace(/[&<>'"]/g, char => ({
					"&": "&amp;",
					"<": "&lt;",
					">": "&gt;",
					"'": "&#39;",
					'"': "&quot;"
				}[char]));
			}

			function buildPopupHTML(item) {
				const iconHTML = item.iconClass ? `<span class="${escapeHTML(item.iconClass)}"></span>` : "";
				const imageHTML = item.image ? `<img src="${escapeHTML(item.image)}" alt="${escapeHTML(item.name)}">` : "";
				const linkHTML = item.link ? `<a class="travel-popup-link" target="_blank" href="${escapeHTML(item.link)}">查看游记</a>` : "";

				return `
					<div class="travel-popup-card">
						<h3>${escapeHTML(item.name)}</h3>
						<div class="travel-popup-meta">
							<span>${escapeHTML(item.time)}</span>
							${iconHTML}
						</div>
						${imageHTML}
						<p class="travel-popup-desc">${escapeHTML(item.description)}</p>
						${linkHTML}
					</div>
				`;
			}

			const markers = travelItems.map(item =>
				L.circleMarker([item.lat, item.lng], {
					radius: 7,
					color: "#e11d48",
					weight: 2,
					fillColor: "#e11d48",
					fillOpacity: 0.85
				})
				.addTo(travelMap)
				.bindPopup(buildPopupHTML(item), { maxWidth: 320 })
			);

			if (markers.length > 0) {
				travelMap.fitBounds(L.featureGroup(markers).getBounds().pad(0.18));
			}
		</script></body>
